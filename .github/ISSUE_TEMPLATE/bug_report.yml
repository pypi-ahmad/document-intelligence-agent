name: Bug report
description: Report a bug or unexpected behaviour.
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. Use synthetic or redistributable PDFs and
        never include real API keys or document content extracted into the
        knowledge graph.

  - type: input
    id: version
    attributes:
      label: Commit or tag
      description: The commit SHA or tag you're running (`git log -1 --oneline`).
    validations:
      required: true

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Minimal steps that trigger the bug. Include whether it happened
        during ingestion or querying, and which query mode (Simple,
        Multi-hop, Comparison, Contradiction, Summary).
      placeholder: |
        1. Ingest a synthetic 3-page PDF.
        2. Set Mode to Multi-hop.
        3. Ask "..."
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: |
        Copy the terminal/Streamlit error output. Remove API keys and
        document content first.

  - type: textarea
    id: env
    attributes:
      label: Environment
      description: |
        OS, whether you used launch.cmd or manual setup, OLLAMA_MODEL,
        EMBED_MODEL, and which complex provider (openai/agnes) you had
        configured. Never include key values.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I can reproduce the bug on the current `main` branch.
          required: true
        - label: I removed API keys and real document content from this report.
          required: true
