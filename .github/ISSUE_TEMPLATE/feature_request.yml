name: Feature request
description: Suggest a new feature or pipeline improvement.
title: "[feat] "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form for new ingestion sources, retrieval/routing changes,
        answer generation behaviour, or other user-visible changes.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user-facing problem does this solve, and why is the current behaviour insufficient?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: |
        Describe the user-visible behaviour, pipeline stage, or UI change
        that would change.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you consider, and why is this the better path?

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: |
        Who benefits? Does it change the knowledge-graph schema, a query
        mode, or which provider (local/complex) handles something?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This does not change what stays local vs. what's sent to the complex provider without documenting it.
          required: true
        - label: I would be willing to open a pull request.
