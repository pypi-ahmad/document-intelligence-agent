[project]
name = "doc-intelligence-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.15",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.5.0",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "networkx>=3.6.1",
    "pypdf>=6.16.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "streamlit>=1.61.1",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.71",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "N", "C4"]

[tool.ty.environment]
python-version = "3.11"
